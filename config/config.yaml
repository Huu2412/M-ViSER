# SER Model Configuration File
# ============================================================
# Multi-Task Learning (MTL-SER) + AURORA Repair Fusion
# Dataset: IEMOCAP (or other English-language SER datasets)
# ============================================================

experiment_name: "ser_mtl_aurora"

# ── Paths ────────────────────────────────────────────────────
paths:
  train_csv:   "data/fold_1/train.csv"
  val_csv:     "data/fold_1/val.csv"
  test_csv:    "data/test.csv"
  output_dir:  "checkpoints"
  cache_dir:   "cache_ser"
  log_dir:     "logs_ser"

# ── Dataset ──────────────────────────────────────────────────
dataset:
  hf_dataset:    "AbstractTTS/IEMOCAP"
  current_fold:  1

  speech_col:    "file"
  text_col:      "text"       # column containing ground-truth transcripts (for teacher)
  emotion_col:   "emotion"
  emotion_label_map:
    neu: 0
    hap: 1
    ang: 2
    sad: 3

  augmentations:
    waveform_augment:
      prob: 0.3                   # Tỷ lệ 30% số audio trong batch sẽ bị augment
      pitch_shift:
        weight: 0.4               # Xác suất rơi vào Pitch Shift (nếu bị augment)
        n_steps_range: [-1.0, 1.0]
      noise_injection:
        weight: 0.4               # Xác suất rơi vào Noise Injection
        noise_factor_range: [0.001, 0.015]
      time_shift:
        weight: 0.2               # Xác suất rơi vào Time Stretch
        range: [0.9, 1.1]

# ── Model & Architecture ─────────────────────────────────────
model:
  # Acoustic backbone (Wav2Vec2 for English)
  acoustic:               "facebook/wav2vec2-base-960h"
  # Text encoder (BERT for English)
  text_model:             "bert-base-uncased"

  fusion_dim:             512
  classifier_hidden_dim:  256
  num_emotion_classes:    4
  num_heads:              8
  dropout:                0.3

# ── Freeze Settings ──────────────────────────────────────────
freeze:
  feature_extractor:  true    # CNN layers of Wav2Vec2 (always frozen)
  acoustic_encoder:   false   # Transformer layers of Wav2Vec2 (finetune)
  text_encoder:       false   # BERT (finetune)

# ── Loss Weights ─────────────────────────────────────────────
loss:
  alpha_student_emotion: 0.5   # Weight for student emotion CE loss
  alpha_teacher_emotion: 0.5   # Weight for teacher emotion CE loss
  alpha_ctc:             0.2   # Weight for CTC ASR auxiliary loss
  alpha_kd:              0.5   # Weight for KL knowledge distillation
  lambda_hallucination:  1.0   # Weight for Cosine Similarity hallucination loss
  kd_temperature:        2.0
  label_smoothing:       0.05

# ── Training ─────────────────────────────────────────────────
training:
  epochs:                     50
  early_stopping_patience:    10     # Stop if metric doesn't improve for 10 epochs
  batch_size:                 8
  num_workers:                8      # Set 0 to avoid 'Broken pipe' on Windows
  gradient_accumulation_steps: 4

  # --- Learning Rates ---
  lr:                         0.0005   # Global fallback LR
  backbone_lr:                0.00001   # LR for pre-trained backbones (Wav2Vec2, BERT)
  head_lr:                    0.00005   # LR for fusion/classifier heads

  # --- Misc ---
  warmup_epochs:              3
  weight_decay:               0.01
  max_audio_length_sec:       10.0
  sampling_rate:              16000
  ctc_zero_infinity:          true
  seed:                       42
  grad_clip_norm:             1.0
  label_smoothing:            0.05

  # --- Checkpoint & Scheduler ---
  checkpoint_metric:          "macro_f1"
  scheduler:
    type: "cosine"
    min_lr: 1.0e-6
    warmup_epochs: 3

# ── Logging ──────────────────────────────────────────────────
logging:
  use_wandb:      false
  wandb_project:  "ser_mtl_aurora"
  log_steps:      50
