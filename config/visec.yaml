# ViSER Configuration File
# ============================================================
# Chỉnh sửa file này để thay đổi hyperparameters thay vì
# sửa trực tiếp vào code. Chạy bằng:
#   python train.py --config config.yaml
#   python evaluate.py --config config.yaml
# ============================================================

# ── Paths ────────────────────────────────────────────────────
paths:
  train_csv:   "data/train.csv"
  val_csv:     "data/val.csv"
  test_csv:    "data/test.csv"
  output_dir:  "checkpoints"
  cache_dir:   "cache_vi_ser"
  log_dir:     "logs_vi_ser"

# ── Pretrained Models ────────────────────────────────────────
models:
  acoustic:    "khanhld/vip-vl-base-vie"        # ViP-VL backbone
  phowhisper:  "vinai/PhoWhisper-medium"         # Teacher ASR
  phobert:     "vinai/phobert-base"              # Text encoder

# ── Model Architecture ───────────────────────────────────────
architecture:
  fusion_dim:             512
  repair_hidden_dim:      256
  classifier_hidden_dim:  256
  num_emotion_classes:    4       # e0/e1/e2/e3
  num_regional_classes:   3       # north/central/south
  num_heads:              8
  dropout:                0.1
  delta_scale:            0.3     # Repair gate bound
  uncertainty_alpha_min:  0.05
  uncertainty_alpha_max:  0.95

# ── Freeze Settings ──────────────────────────────────────────
freeze:
  feature_extractor:  true    # CNN layers của ViP-VL
  acoustic_encoder:   false   # Transformer layers của ViP-VL
  phobert:            false   # PhoBERT text encoder
  teacher:            true    # PhoWhisper luôn frozen

# ── Loss Weights ─────────────────────────────────────────────
loss:
  alpha_ctc:       0.1    # CTC student ASR auxiliary
  alpha_kd:        0.5    # KL knowledge distillation (student || teacher)
  alpha_distill:   0.3    # MSE representation alignment
  alpha_regional:  0.8    # Regional accent auxiliary
  kd_temperature:  2.0    # Softmax temperature cho KD

# ── Training ─────────────────────────────────────────────────
training:
  num_epochs:                 100
  batch_size:                 8
  gradient_accumulation_steps: 4   # effective batch = 4 * 4 = 16
  learning_rate:              5.0e-5
  weight_decay:               0.01
  warmup_ratio:               0.1
  max_audio_length_sec:       10.0
  sampling_rate:              16000
  ctc_zero_infinity:          true
  seed:                       42
  num_workers:                4

# ── Data / Labels ─────────────────────────────────────────────
data:
  speech_col:    "file"
  text_col:      "text"
  emotion_col:   "emotion"
  regional_col:  "regional"
  emotion_label_map:
    e0: 0   # neutral
    e1: 1   # happy
    e2: 2   # angry
    e3: 3   # sad
  regional_label_map:
    north:   0   # Bắc
    central: 1   # Trung
    south:   2   # Nam

# ── Logging / Experiment Tracking ────────────────────────────
logging:
  use_wandb:      false
  wandb_project:  "viser"
  log_steps:      50        # Log every N steps
